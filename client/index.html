<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Username Claim — Prototype</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --border: #2a2f3a;
    --text: #e8e9ec;
    --dim: #8a8f9c;
    --good: #4ade80;
    --bad: #f87171;
    --accent: #7c9eff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.25rem; }
  .sub { color: var(--dim); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .id-row { font-size: 0.75rem; color: var(--dim); word-break: break-all; }
  .id-row b { color: var(--text); }
  form { display: flex; gap: 0.5rem; }
  input[type="text"] {
    flex: 1;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0f1115;
    border: none;
    padding: 0.7rem 1.1rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .feedback { margin-top: 0.6rem; font-size: 0.9rem; min-height: 1.3em; }
  .feedback.success { color: var(--good); }
  .feedback.fail { color: var(--bad); }
  .stats { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--dim); }
  .stats b { color: var(--text); font-size: 1.1rem; display: block; }
  .collection { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .chip {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    font-size: 0.85rem;
    font-family: ui-monospace, monospace;
  }
  .empty { color: var(--dim); font-size: 0.85rem; font-style: italic; }
  .hint { font-size: 0.75rem; color: var(--dim); margin-top: 0.4rem; }
</style>
</head>
<body>
<div class="app">
  <h1>Username Claim — Prototype</h1>
  <div class="sub">3–15 chars, letters and numbers, case-sensitive. First come, first served — forever.</div>

  <div class="panel">
    <div class="id-row">Status: <b id="connStatus">connecting…</b></div>
    <div class="id-row">Player ID: <b id="playerId">—</b></div>
  </div>

  <div class="panel">
    <form id="claimForm">
      <input id="claimInput" type="text" placeholder="Try a username…" maxlength="15" autocomplete="off" />
      <button type="submit" id="claimBtn" disabled>Claim</button>
    </form>
    <div id="feedback" class="feedback"></div>
    <div class="hint">Letters (upper/lowercase distinct) and digits only.</div>
  </div>

  <div class="panel">
    <div class="stats">
      <div><b id="myCount">0</b>your usernames</div>
      <div><b id="totalCount">0</b>claimed globally</div>
    </div>
  </div>

  <div class="panel">
    <div id="collection" class="collection">
      <div class="empty">No usernames claimed yet.</div>
    </div>
  </div>
</div>

<script>
// Auto-detect: if this page is served over the network, assume the
// WebSocket server is reachable at the same host on port 8080. If you
// deploy the server somewhere else, just hardcode its wss:// URL here.
const WS_URL = (() => {
  if (location.protocol === "file:") return "ws://localhost:8080";
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.hostname}:8080`;
})();

let ws;
let token = localStorage.getItem("usernamegame_token") || null;

function setStatus(text, isError) {
  const el = document.getElementById("connStatus");
  el.textContent = text;
  el.style.color = isError ? "var(--bad)" : "var(--good)";
  document.getElementById("claimBtn").disabled = !!isError;
}

function connect() {
  setStatus(`connecting to ${WS_URL}…`, false);
  document.getElementById("claimBtn").disabled = true;

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    setStatus(`failed to connect: ${e.message}`, true);
    setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus("connected — identifying…", false);
    ws.send(JSON.stringify({ type: "hello", token }));
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    handleMessage(msg);
  };

  ws.onerror = () => {
    setStatus(`cannot reach server at ${WS_URL}`, true);
  };

  ws.onclose = () => {
    setStatus(`disconnected — retrying…`, true);
    setTimeout(connect, 1500);
  };
}

function handleMessage(msg) {
  if (msg.type === "welcome") {
    token = msg.token;
    localStorage.setItem("usernamegame_token", token);
    document.getElementById("playerId").textContent = msg.playerId;
    setStatus("connected", false);
    renderCollection(msg.collection);
    ws.send(JSON.stringify({ type: "get_stats" }));
    return;
  }

  if (msg.type === "claim_result") {
    const fb = document.getElementById("feedback");
    if (msg.success) {
      fb.textContent = `Claimed "${msg.value}"!`;
      fb.className = "feedback success";
      document.getElementById("claimInput").value = "";
      ws.send(JSON.stringify({ type: "get_my_usernames" }));
    } else {
      const reasons = {
        ALREADY_CLAIMED: "That username is unavailable.",
        INVALID_FORMAT: "3–15 letters/numbers only.",
        INVALID_TYPE: "Invalid input.",
        UNKNOWN_PLAYER: "Connection issue — refresh.",
      };
      fb.textContent = reasons[msg.reason] || `Failed: ${msg.reason}`;
      fb.className = "feedback fail";
    }
    document.getElementById("myCount").textContent = msg.collectionCount;
    ws.send(JSON.stringify({ type: "get_stats" }));
    return;
  }

  if (msg.type === "my_usernames") {
    renderCollection(msg.collection);
    return;
  }

  if (msg.type === "stats") {
    document.getElementById("myCount").textContent = msg.myCount;
    document.getElementById("totalCount").textContent = msg.totalClaimed;
    return;
  }

  if (msg.type === "error") {
    console.error("Server error:", msg.reason);
  }
}

function renderCollection(collection) {
  const el = document.getElementById("collection");
  if (!collection || collection.length === 0) {
    el.innerHTML = '<div class="empty">No usernames claimed yet.</div>';
    return;
  }
  el.innerHTML = collection
    .map((c) => `<div class="chip">${escapeHtml(c.value)}</div>`)
    .join("");
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById("claimForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("claimInput");
  const value = input.value.trim();
  if (!value) return;
  ws.send(JSON.stringify({ type: "claim_username", value }));
});

connect();
</script>
</body>
</html>
